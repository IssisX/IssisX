name: Kinetic Foundry Visual Capture

on:
  push:
    branches: [kinetic-foundry]
    paths:
      - "kinetic-foundry/**"
      - ".github/workflows/kinetic-foundry-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[skip capture]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    name: Render deterministic screenshots

    env:
      GODOT_VERSION: "4.3"
      GODOT_BIN: /tmp/Godot_v4.3-stable_linux.x86_64
      CAPTURE_DIR: ${{ github.workspace }}/kinetic-foundry/captures/latest
      LIBGL_ALWAYS_SOFTWARE: "1"
      KF_CAPTURE: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: kinetic-foundry

      - name: Install Godot 4.3 renderer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Import project once
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$GODOT_BIN" --path kinetic-foundry --editor --quit

      - name: Render capture suite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CAPTURE_DIR"
          mkdir -p "$CAPTURE_DIR"
          set +e
          timeout --signal=TERM 45s xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$GODOT_BIN" --path kinetic-foundry --audio-driver Dummy \
            2>&1 | tee /tmp/kinetic-capture.log
          status=${PIPESTATUS[0]}
          set -e
          cat /tmp/kinetic-capture.log
          if [ "$status" -eq 124 ]; then
            echo "CAPTURE_TIMEOUT"
            exit 124
          fi
          test "$status" -eq 0
          grep -q 'CAPTURE_STAGE activation' /tmp/kinetic-capture.log
          grep -q 'CAPTURE_SUITE_OK' /tmp/kinetic-capture.log

      - name: Verify capture set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            01_yard_overview.png
            02_combat_staging.png
            03_excavator_operation.png
            04_structure_failure.png
          )
          for name in "${expected[@]}"; do
            file="$CAPTURE_DIR/$name"
            test -s "$file"
            test "$(stat -c%s "$file")" -gt 10000
          done
          ls -lh "$CAPTURE_DIR"

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: KineticFoundry-Screenshots-${{ github.run_number }}
          path: kinetic-foundry/captures/latest/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit latest captures for visual review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kinetic-foundry/captures/latest/*.png
          if git diff --cached --quiet; then
            echo "Captures unchanged"
            exit 0
          fi
          git commit -m "[skip capture] Update Kinetic Foundry visual captures"
          git push origin HEAD:kinetic-foundry
